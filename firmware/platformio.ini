[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = madhephaestus/ESP32Encoder@^5.0.0

; Firmware chính
[env:esp32dev]

; Công cụ đo encoder: pio run -e encoder_test -t upload
[env:encoder_test]
build_src_filter = -<*> +<../tools/encoder_test.cpp>

; Nhận diện motor + encoder (KÊ ROBOT LÊN): pio run -e motor_test -t upload
[env:motor_test]
build_src_filter = -<*> +<../tools/motor_test.cpp>
